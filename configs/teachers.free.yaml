teachers:
  # Kostenlose OpenRouter-Modelle als Mechanik-Test der Generierungskette.
  # Ersetzen die Ziel-Lehrer nicht: sie dienen dem Durchlauf der Kette
  # (Generieren -> Verifizieren -> Ranking -> Freigabe) ohne Kontoguthaben.
  - alias: ling_3_2_flash
    display_name: Ling 3.2 Flash (free)
    provider: openrouter
    candidate_model_ids:
      - inclusionai/ling-3.2-flash:free
      - inclusionai/ling-3.2-flash
    model_id_env: LING_3_2_FLASH_MODEL_ID
    api_key_env: OPENROUTER_API_KEY

