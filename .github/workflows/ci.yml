name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compile source
        run: python -m compileall -q src

      - name: Run tests
        run: pytest -q
      - name: Validate task banks
        run: |
          python - <<'PY'
          from pathlib import Path
          from aion_u1.training.tasks import load_task_bank
          for path in sorted(Path("training/configs/tasks").glob("*.yaml")):
              bank = load_task_bank(path)
              assert bank.tasks, f"{path}: Task-Bank ist leer."
              print(f"{path.name}: {len(bank.tasks)} Tasks")
          PY

      - name: Validate SFT configurations
        run: |
          python - <<'PY'
          from pathlib import Path
          from aion_u1.training.config import load_sft_config
          for path in sorted(Path("training/configs").glob("sft_*.yaml")):
              load_sft_config(path)
              print(f"{path.name}: ok")
          PY

      - name: Validate real pilot training readiness (offline)
        run: |
          aion-u1-preflight \
            --config training/configs/sft_lora_open_v4.yaml \
            --suite evaluations/capability_suite/benchmark_hard_v2.yaml \
            --capabilities configs/capabilities.yaml

  catalog:
    # Teacher-IDs live gegen den Provider-Katalog pruefen. Der Katalog ist
    # oeffentlich; ein Platzhalter-Key genuegt, weil nur /api/v1/models
    # abgefragt wird. Ein falscher Eintrag muss den Lauf kippen — so wie
    # `cohere/north-mini-code`, das im Katalog nie existierte.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: pip install -e "."

      - name: Teacher-Konfigurationen verifizieren
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || 'katalog-only' }}
        run: |
          for config in configs/teachers*.yaml; do
            echo "== $config"
            aion-u1 verify-teachers \
              --teachers "$config" \
              --output "reports/$(basename "$config" .yaml).json"
          done


  functional-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Resolve local test image digest
        run: |
          docker pull python:3.12-slim
          image=$(docker image inspect --format '{{index .RepoDigests 0}}' python:3.12-slim)
          [[ "$image" =~ @sha256:[a-f0-9]{64}$ ]]
          echo "AION_VERIFIER_DOCKER_IMAGE=$image" >> "$GITHUB_ENV"
          echo "Test image: $image"
      - name: Run real Docker tests (synthetic code, no teacher APIs)
        run: pytest -q tests/test_functional_docker_live.py
