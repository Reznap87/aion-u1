[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aion-u1"
version = "0.1.0"
description = "Training and evaluation infrastructure for the AION-U1 unified model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "PyYAML>=6,<7",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
aion-u1 = "aion_u1.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aion_u1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
