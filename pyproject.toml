[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aion-u1"
version = "0.2.0"
description = "Training and evaluation infrastructure for the AION-U1 unified model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "PyYAML>=6,<7",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]
train = [
    "torch>=2.4,<3",
    "transformers==4.46.3",
    "accelerate==1.1.1",
    "peft==0.13.2",
    "safetensors>=0.4.5,<1",
    "sentencepiece>=0.2,<1",
]

[project.scripts]
aion-u1 = "aion_u1.cli:main"
aion-u1-prepare-sft = "aion_u1.training.prepare:main"
aion-u1-approve-sft = "aion_u1.training.approve:main"
aion-u1-train-sft = "aion_u1.training.sft:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aion_u1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
