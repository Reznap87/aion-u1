run:
  name: aion-u1-sft-pilot
  output_dir: artifacts/sft/pilot
  seed: 20251027
  resume_from_checkpoint: null
  overwrite_output_dir: false

data:
  train_path: data/verified/sft_train.jsonl
  eval_path: data/verified/sft_eval.jsonl
  max_seq_length: 4096
  require_training_approval: true

model:
  base_model: Qwen/Qwen2.5-1.5B-Instruct
  revision: main
  trust_remote_code: false
  dtype: auto
  attn_implementation: eager
  license_acknowledged: false

peft:
  enabled: true
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  merge_and_save: false

training:
  num_train_epochs: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  weight_decay: 0.0
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  max_grad_norm: 1.0
  optim: adamw_torch
  logging_steps: 5
  save_strategy: epoch
  save_total_limit: 2
  load_best_model_at_end: true
  gradient_checkpointing: true
  bf16: false
  fp16: false
  tf32: false
  full_determinism: false
