      - kimi_k3
      - claude_fable_5_1
      - gpt_6_1_sol
      - claude_sonnet_5_5
      - gemini_3_8_flash
      - grok_4_7
      - kimi_k3_agent

  - id: multilingual.german_json
    capability: multilingual.quality
    prompt: |
      Antworte auf Deutsch und ausschließlich als JSON:
      {"sprache":"Deutsch","status":"bereit"}
    verifier:
      type: json_equals
