version: 1


tasks:
  - id: code.add
    capability: code.synthesis
    prompt: |
      Implementiere in Python eine Funktion add(a, b), die a + b zurückgibt.
      Gib nur Python-Code aus.
    verifier:
      type: python_code
      timeout_seconds: 15
      test_code: |
        import unittest
        import solution

        class AddTests(unittest.TestCase):
            def test_add(self):
                self.assertEqual(solution.add(2, 3), 5)

        unittest.main()
    teacher_aliases:
      - minimax_m3_1_flash
      - kimi_k3
      - claude_fable_5_1
      - gpt_6_1_sol
      - claude_sonnet_5_5
      - gemini_3_8_flash
      - grok_4_7
      - kimi_k3_agent
    samples_per_teacher: 1
    temperature: 0.1

  - id: code.safe_divide
    capability: code.synthesis
    prompt: |
      Implementiere safe_divide(a, b). Bei Division durch null wird None
      zurückgegeben, sonst das numerische Ergebnis. Gib nur Python-Code aus.
    verifier:
      type: python_code
      timeout_seconds: 15
      test_code: |
        import unittest
        import solution

        class DivideTests(unittest.TestCase):
            def test_regular(self):
                self.assertEqual(solution.safe_divide(10, 2), 5)

            def test_zero(self):
                self.assertIsNone(solution.safe_divide(10, 0))

        unittest.main()
    teacher_aliases:
      - minimax_m3_1_flash
      - kimi_k3
      - claude_fable_5_1
      - gpt_6_1_sol
      - claude_sonnet_5_5
      - gemini_3_8_flash
      - grok_4_7
      - kimi_k3_agent
    samples_per_teacher: 1
    temperature: 0.1

  - id: reasoning.arithmetic
    capability: reasoning.logical
    prompt: |
      Berechne 19 + 28 + 37. Antworte ausschließlich mit der Zahl.
    verifier:
      type: exact_match
      values:
        - "84"
    teacher_aliases:
      - minimax_m3_1_flash
      - kimi_k3
      - claude_fable_5_1
      - gpt_6_1_sol
      - claude_sonnet_5_5
      - gemini_3_8_flash
      - grok_4_7
      - kimi_k3_agent

  - id: reasoning.syllogism
    capability: reasoning.logical
    prompt: |
      Alle AION-Builder sind getestet. Kein getestetes System ist fehlerhaft.
      Was folgt zwingend? Antworte exakt mit:
      Kein AION-Builder ist fehlerhaft.
    verifier:
      type: exact_match
      values:
        - "Kein AION-Builder ist fehlerhaft."
    teacher_aliases:
      - minimax_m3_1_flash
      - kimi_k3
      - claude_fable_5_1
      - gpt_6_1_sol
      - claude_sonnet_5_5
      - gemini_3_8_flash
      - grok_4_7
      - kimi_k3_agent

  - id: long_context.needle
    capability: long_context.retention
    prompt: |
      Kontext:
      ORBIT-11 LUNAR-42 VEGA-73 NOVA-24 ATLAS-95 ZENITH-31
      PULSAR-18 COMET-57 NEBULA-82 GALAXY-29 QUASAR-64 DRACO-17
      METEOR-38 ORION-76 LYRA-22 POLARIS-49 ZEUS-13 HERMES-68
      TITAN-27 JANUS-84 PHOENIX-35 ATLAS-61 VEGA-08 NEBULA-46

      Welche Zahl steht direkt nach VEGA-08? Antworte ausschließlich mit der Zahl.
    verifier:
      type: exact_match
      values:
        - "46"
    teacher_aliases:
      - minimax_m3_1_flash
      - kimi_k3
      - claude_fable_5_1
      - gpt_6_1_sol
      - claude_sonnet_5_5
      - gemini_3_8_flash
      - grok_4_7
      - kimi_k3_agent

  - id: agent.read_file
    capability: agent.tool_use
    prompt: |
      Der Benutzer möchte README.md lesen. Gib ausschließlich JSON aus:
      {"tool":"read_file","path":"README.md"}
    verifier:
      type: json_equals
      expected:
        tool: read_file
        path: README.md
    teacher_aliases:
      - minimax_m3_1_flash
      - kimi_k3
      - claude_fable_5_1
      - gpt_6_1_sol
      - claude_sonnet_5_5
      - gemini_3_8_flash
      - grok_4_7
      - kimi_k3_agent

  - id: agent.recover_timeout
    capability: agent.tool_use
    prompt: |
      Der Aufruf search("AION") endet mit Timeout. Wähle die nächste Aktion.
      Gib ausschließlich JSON aus:
      {"action":"retry_with_backoff","tool":"search","query":"AION"}
    verifier:
      type: json_equals
      expected:
        action: retry_with_backoff
        tool: search
        query: AION
    teacher_aliases:
      - minimax_m3_1_flash
      - kimi_k3
      - claude_fable_5_1
      - gpt_6_1_sol
      - claude_sonnet_5_5
      - gemini_3_8_flash
      - grok_4_7
      - kimi_k3_agent

  - id: research.grounded_quote
    capability: research.verification
    prompt: |
      Gegeben ist ausschließlich diese Quelle:
      "Das ORBIT-Projekt wurde am 12. Juni 2025 abgeschlossen und erreichte
      98 Prozent Testabdeckung."
      Nenne Datum und Testabdeckung vollständig. Antworte nur mit dem Satz.
    verifier:
      type: contains_all
      values:
        - "12. Juni 2025"
        - "98 Prozent"
    teacher_aliases:
      - minimax_m3_1_flash
      - kimi_k3
      - claude_fable_5_1
      - gpt_6_1_sol
      - claude_sonnet_5_5
      - gemini_3_8_flash
      - grok_4_7
      - kimi_k3_agent

  - id: writing.clear_explanation
    capability: writing.quality
    prompt: |
      Schreibe auf Deutsch genau zwei Sätze über den Nutzen verifizierter
      Trainingsdaten. Verwende "Trainingsdaten" und "verifiziert".
    verifier:
