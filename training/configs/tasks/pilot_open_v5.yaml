version: 1

# Sechste Runde, gezielt gegen die drei Capabilities, in denen Baseline und
# Adapter beide bei 0.00 lagen: code.synthesis, reasoning.logical,
# instruction.structured_output. Die Aufgaben sind so gebaut, dass die
# Erwartung aus dem Prompt folgt und ein Verifier sie deterministisch prueft.
tasks:
  - id: open5.code.max_gap
    capability: code.synthesis
    prompt: |
      Schreibe eine Python-Funktion `max_gap(werte)`, die den groessten Abstand
      zwischen zwei aufeinanderfolgenden sortierten Werten liefert. Gib nur den
      Code aus.
    verifier:
      type: python_code
      timeout_seconds: 20
      test_code: |
        import unittest
        import solution

        class GapTests(unittest.TestCase):
            def test_gap(self):
                self.assertEqual(solution.max_gap([1, 3, 6]), 3)
                self.assertEqual(solution.max_gap([1, 2]), 1)

        unittest.main()
    teacher_aliases: &lehrer
      - qwen3_coder_next
      - qwen3_235b
      - gemma_4_31b
      - granite_4_2_8b
      - phi_4
      - nemotron_3_5_lightning
      - nemotron_3_ultra
      - deepseek_r1
    samples_per_teacher: 1
    temperature: 0.1

  - id: open5.code.read_lines
    capability: code.synthesis
    prompt: |
      Schreibe eine Python-Funktion `count_lines(pfad)`, die die Anzahl der
      nicht-leeren Zeilen einer Datei liefert. Gib nur den Code aus.
    verifier:
      type: python_code
      timeout_seconds: 20
      test_code: |
        import pathlib
        import tempfile
        import unittest
        import solution

        class LineTests(unittest.TestCase):
            def test_count(self):
                with tempfile.TemporaryDirectory() as ordner:
                    datei = pathlib.Path(ordner) / "probe.txt"
                    datei.write_text("a\n\nb\n", encoding="utf-8")
                    self.assertEqual(solution.count_lines(str(datei)), 2)

        unittest.main()
    teacher_aliases: *lehrer
    samples_per_teacher: 1
    temperature: 0.1

  - id: open5.reasoning.mixture
    capability: reasoning.logical
    prompt: |
      Eine 20-prozentige Salzloesung mischt sich mit einer 50-prozentigen. Wie
      viel von jeder braucht man fuer genau 30 Prozent in 10 Litern?
      Antworte nur als JSON mit den Schluesseln menge_20 und menge_50 (Zahlen).
    verifier:
      type: json_equals
      expected:
        menge_20: 6.67
        menge_50: 3.33
    teacher_aliases: *lehrer
    samples_per_teacher: 1
    temperature: 0.1

  - id: open5.reasoning.comparison
    capability: reasoning.logical
    prompt: |
      Drei Angebote: A kostet 100 Euro plus 5 Euro je Stueck, B kostet 50 Euro
      plus 8 Euro je Stueck. Ab wie vielen Stueck ist A billiger?
      Antworte nur als JSON mit dem Schluessel ab_stueck (Zahl).
    verifier:
      type: json_equals
      expected:
        ab_stueck: 17
    teacher_aliases: *lehrer
    samples_per_teacher: 1
    temperature: 0.1

  - id: open5.instruction.exact_keys
    capability: instruction.structured_output
    prompt: |
      Gib ausschliesslich JSON aus mit den Feldern: titel (Wert Bahn),
      jahr (Zahl 1995), tags (genau zwei Eintraege: schnell, gruen).
    verifier:
      type: json_equals
      expected:
        titel: Bahn
        jahr: 1995
        tags: [schnell, gruen]
    teacher_aliases: *lehrer
    samples_per_teacher: 1
    temperature: 0.1

  - id: open5.instruction.no_words
    capability: instruction.structured_output
    prompt: |
      Erklaere in einem Satz, was eine Pipeline ist, ohne die Woerter „Daten"
      und „Schritte" zu verwenden.
    verifier:
      type: not_contains
      values:
        - "Daten"
        - "Schritte"
    teacher_aliases: *lehrer
    samples_per_teacher: 1
    temperature: 0.1
