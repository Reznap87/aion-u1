run:
  name: aion-u1-local-trained-pilot-20261102
  output_dir: ../../outputs/AION-U1-local-trained-pilot-20261102
  seed: 20261102
  overwrite_output_dir: false

data:
  train_path: data/verified/procedural-v1/train.jsonl
  eval_path: data/verified/procedural-v1/dev.jsonl
  max_seq_length: 128
  require_training_approval: true

model:
  base_model: ../models/qwen2.5-1.5b-989aa7980e4c
  revision: 989aa7980e4cf806f80c7fef2b1adb7bc71aa306
  trust_remote_code: false
  dtype: float32
  attn_implementation: sdpa
  license_acknowledged: true

peft:
  enabled: true
  r: 8
  lora_alpha: 16
  lora_dropout: 0.0
  target_modules: [q_proj, v_proj]
  merge_and_save: true

training:
  max_steps: 16
  save_steps: 4
  num_train_epochs: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 2
  learning_rate: 0.0002
  warmup_ratio: 0.0
  save_strategy: steps
  save_total_limit: 2
  load_best_model_at_end: true
  gradient_checkpointing: true
  logging_steps: 1
  evaluate_before_training: true
