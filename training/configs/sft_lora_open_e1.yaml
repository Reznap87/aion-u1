# Ziel: Endlosschleifen abstellen. Der v3-Lauf (3 Epochen, 58 Saetze) hatte
# 12/24 korrekt, aber 3 length-Abbrueche; der Nachlauf mit derselben Config auf
# 63 Saetzen hatte nur 10/24 und 9 length-Abbrueche. Beide trainierten 3
# Epochen — die Hypothese „1 Epoche bricht das Overfitting" ist damit noch
# nicht geprueft. Diese Config testet genau sie.

base_model: Qwen/Qwen2.5-1.5B-Instruct
train_file: data/verified/pilot_open_train.jsonl
eval_file: data/verified/pilot_open_eval.jsonl
output_dir: artifacts/sft/pilot_open_e1

num_train_epochs: 1.0
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 0.0001
warmup_ratio: 0.05
lr_scheduler_type: cosine
weight_decay: 0.0
max_grad_norm: 1.0
logging_steps: 1
save_strategy: epoch
eval_strategy: epoch

fp16: false
bf16: false
load_best_model_at_end: false
seed: 42
